<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizador Personal — Dashboard & Tareas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      
      /* Categorías */
      --cat-trabajo: #38bdf8;
      --cat-admin: #fbbf24;
      --cat-proyectos: #c084fc;
      --cat-prog: #34d399;
      
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --danger: #f43f5e;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px 16px 60px;
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* HEADER & DASHBOARD */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
    }

    .title-area h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .title-area p {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 2px;
    }

    .dashboard-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
    }

    .dash-metrics {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .metric-group {
      display: flex;
      flex-direction: column;
    }

    .metric-value {
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }

    .metric-label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 4px;
    }

    .progress-bar-bg {
      height: 10px;
      width: 100%;
      background-color: #0f172a;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #34d399);
      border-radius: 99px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* CONTROLES Y FILTROS */
    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-tabs {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }

    .filter-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: var(--border);
      color: var(--text);
    }

    .add-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, transform 0.1s;
    }

    .add-btn:hover { background: var(--accent-hover); }
    .add-btn:active { transform: scale(0.97); }

    /* LISTA DE TAREAS */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: transform 0.2s, border-color 0.2s;
      animation: fadeIn 0.25s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .task-card:hover {
      border-color: #475569;
    }

    .checkbox-custom {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .task-card.completed .checkbox-custom {
      background: var(--accent);
      border-color: var(--accent);
    }

    .checkbox-custom::after {
      content: '✓';
      color: white;
      font-size: 13px;
      font-weight: 800;
      display: none;
    }

    .task-card.completed .checkbox-custom::after { display: block; }

    .task-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .task-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      transition: color 0.2s, text-decoration 0.2s;
    }

    .task-card.completed .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .badge {
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .badge.trabajo { background: rgba(56, 189, 248, 0.15); color: var(--cat-trabajo); }
    .badge.admin { background: rgba(251, 191, 36, 0.15); color: var(--cat-admin); }
    .badge.proyectos { background: rgba(192, 132, 252, 0.15); color: var(--cat-proyectos); }
    .badge.programacion { background: rgba(52, 211, 153, 0.15); color: var(--cat-prog); }

    .task-date {
      color: var(--text-muted);
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: color 0.2s, background 0.2s;
    }

    .delete-btn:hover {
      color: var(--danger);
      background: rgba(244, 63, 94, 0.1);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 14px;
      background: var(--card-bg);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    /* FORMULARIO MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-backdrop.hidden { display: none; }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 440px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }

    .modal-card h2 {
      font-size: 18px;
      font-weight: 700;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .field input, .field select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }

    .field input:focus, .field select:focus {
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 8px;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Encabezado -->
    <header>
      <div class="title-area">
        <h1>Mi Espacio de Trabajo</h1>
        <p>Gestión de pendientes y metas</p>
      </div>
    </header>

    <!-- Dashboard -->
    <div class="dashboard-card">
      <div class="dash-metrics">
        <div class="metric-group">
          <span class="metric-value" id="progress-percent">0%</span>
          <span class="metric-label">Progreso general</span>
        </div>
        <div class="metric-group" style="align-items: flex-end;">
          <span class="metric-value" id="completed-count">0 / 0</span>
          <span class="metric-label">Tareas completadas</span>
        </div>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- Filtros y Botón de creación -->
    <div class="controls-row">
      <div class="filter-tabs">
        <button class="filter-btn active" onclick="setFilter('all', this)">Todas</button>
        <button class="filter-btn" onclick="setFilter('pending', this)">Pendientes</button>
        <button class="filter-btn" onclick="setFilter('completed', this)">Completadas</button>
      </div>
      <button class="add-btn" onclick="openModal()">+ Nueva tarea</button>
    </div>

    <!-- Lista de tareas -->
    <div class="task-list" id="task-list"></div>
  </div>

  <!-- Modal para Agregar Tarea -->
  <div class="modal-backdrop hidden" id="modal">
    <div class="modal-card">
      <h2>Agregar nuevo pendiente</h2>
      <div class="field">
        <label for="task-title">Título de la tarea</label>
        <input type="text" id="task-title" placeholder="Ej: Revisar documentación del proyecto">
      </div>
      <div class="field">
        <label for="task-category">Categoría</label>
        <select id="task-category">
          <option value="trabajo">Trabajo</option>
          <option value="admin">Administrativa</option>
          <option value="proyectos">Proyecto Personal</option>
          <option value="programacion">Programación</option>
        </select>
      </div>
      <div class="field">
        <label for="task-date">Fecha límite (opcional)</label>
        <input type="date" id="task-date">
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
        <button class="add-btn" onclick="addTask()">Guardar tarea</button>
      </div>
    </div>
  </div>

  <script>
    // Inicialización del Estado y localStorage
    let tasks = JSON.parse(localStorage.getItem('organizador_tareas')) || [
      { id: 1, title: 'Diseñar interfaz del Dashboard', category: 'programacion', date: '2026-08-05', completed: true },
      { id: 2, title: 'Organizar documentación administrativa', category: 'admin', date: '2026-08-10', completed: false },
      { id: 3, title: 'Reunión de coordinación de proyecto', category: 'trabajo', date: '2026-08-02', completed: false }
    ];

    let currentFilter = 'all';

    function saveTasks() {
      localStorage.setItem('organizador_tareas', JSON.stringify(tasks));
      render();
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function toggleTask(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      saveTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
    }

    function openModal() {
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('task-title').focus();
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('task-title').value = '';
      document.getElementById('task-date').value = '';
    }

    function addTask() {
      const title = document.getElementById('task-title').value.trim();
      const category = document.getElementById('task-category').value;
      const date = document.getElementById('task-date').value;

      if (!title) return;

      const newTask = {
        id: Date.now(),
        title,
        category,
        date: date || 'Sin fecha',
        completed: false
      };

      tasks.unshift(newTask);
      saveTasks();
      closeModal();
    }

    function getCategoryLabel(cat) {
      const map = {
        trabajo: 'Trabajo',
        admin: 'Administración',
        proyectos: 'Proyecto',
        programacion: 'Programación'
      };
      return map[cat] || cat;
    }

    function render() {
      const listEl = document.getElementById('task-list');
      listEl.innerHTML = '';

      // Calcular Métricas Dashboard
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

      document.getElementById('progress-percent').innerText = `${percent}%`;
      document.getElementById('completed-count').innerText = `${completed} / ${total}`;
      document.getElementById('progress-fill').style.width = `${percent}%`;

      // Filtrado
      const filteredTasks = tasks.filter(t => {
        if (currentFilter === 'pending') return !t.completed;
        if (currentFilter === 'completed') return t.completed;
        return true;
      });

      if (filteredTasks.length === 0) {
        listEl.innerHTML = `<div class="empty-state">No hay tareas para mostrar en esta categoría.</div>`;
        return;
      }

      // Renderizar Tarjetas
      filteredTasks.forEach(task => {
        const card = document.createElement('div');
        card.className = `task-card ${task.completed ? 'completed' : ''}`;
        
        card.innerHTML = `
          <div class="checkbox-custom" onclick="toggleTask(${task.id})"></div>
          <div class="task-content">
            <span class="task-title">${task.title}</span>
            <div class="task-meta">
              <span class="badge ${task.category}">${getCategoryLabel(task.category)}</span>
              ${task.date !== 'Sin fecha' ? `<span class="task-date">📅 ${task.date}</span>` : ''}
            </div>
          </div>
          <button class="delete-btn" onclick="deleteTask(${task.id})" title="Eliminar">✕</button>
        `;

        listEl.appendChild(card);
      });
    }

    // Carga inicial
    render();
  </script>
</body>
</html>
